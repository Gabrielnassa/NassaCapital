# Compila o app e publica no GitHub Pages a cada push.
# O certo é Settings > Pages > Source = "GitHub Actions". Enquanto estiver em "Deploy from a branch",
# o GitHub publica o código-fonte cru logo depois de cada push (página em branco); por isso este
# workflow espera essa publicação automática terminar antes de pôr o build no lugar.
name: Publicar no GitHub Pages

on:
  push:
    branches: [claude/new-session-4gm2ci, main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Valores públicos do projeto Supabase "Carteira" (a segurança vem do RLS, não destes valores).
          # Para apontar para outro projeto, crie as variáveis de mesmo nome em Settings > Variables.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://ffyrnrqixhpigmiiatwz.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_43DxMdTLWRZC5vZOpnu4ww_3s2zsD6t' }}
      # O Pages não conhece as rotas do app: o 404 devolve o próprio app, que resolve a rota.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Espera a publicação automática do Pages terminar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs?per_page=30" \
              --jq '[.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment" and .status != "completed")] | length')
            echo "publicações automáticas em andamento: $n"
            [ "$n" = "0" ] && break
            sleep 10
          done
      - id: deployment
        uses: actions/deploy-pages@v4

# Compila o app e publica no GitHub Pages a cada push.
# O certo é Settings > Pages > Source = "GitHub Actions". Enquanto estiver em "Deploy from a branch",
# o GitHub publica o código-fonte cru logo depois de cada push (página em branco); por isso este
# workflow roda de novo quando essa publicação automática termina e põe o build no lugar.
name: Publicar no GitHub Pages

on:
  push:
    branches: [claude/new-session-4gm2ci, main]
  workflow_dispatch:
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Valores públicos do projeto Supabase (Settings > Secrets and variables > Actions > Variables).
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      # O Pages não conhece as rotas do app: o 404 devolve o próprio app, que resolve a rota.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
